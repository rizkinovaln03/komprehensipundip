        let totalTargetPenyakit = 0;
        dataPenyakit.forEach(item => totalTargetPenyakit += item.target);

        let totalTargetKeterampilan = 0;

        function renderList(tipe, dataArray) {
            const container = document.getElementById(`list-${tipe}`);
            let htmlHTML = "";
            dataArray.forEach((item, index) => {
                const safeId = `${tipe}-${index}`;
                // Tampilkan target di samping nama + INPUT NUMBER
                htmlHTML += `
                    <div class="item ${tipe}-item">
                        <label for="${safeId}">${item.nama} <span class="badge-target">Tgt: ${item.target}</span></label>
                        <input type="number" id="${safeId}" class="${tipe}-input" data-nama="${item.nama}" value="0" min="0" max="100" onfocus="if(this.value=='0')this.value='';" onblur="if(this.value=='')this.value='0';" oninput="updateCounter('${tipe}')">
                    </div>
                `;
            });
            container.innerHTML = htmlHTML;
        }

        renderList("penyakit", dataPenyakit);
        renderList("keterampilan", dataKeterampilan);

        function updateCounter(tipe) {
            let totalCeklis = 0;
            let totalBobotPersen = 0;
            let jumlahItemBerTarget = 0;

            // Ambil data acuan berdasarkan tipe
            const dataArray = tipe === 'penyakit' ? dataPenyakit : dataKeterampilan;
            const inputs = document.querySelectorAll(`.${tipe}-input`);

            inputs.forEach((inp, index) => {
                let val = parseInt(inp.value) || 0;
                let targetAsli = dataArray[index].target;

                if (val > 0) {
                    totalCeklis++;
                }

                // Hanya hitung penyakit/keterampilan yang memang ada targetnya
                if (targetAsli > 0) {
                    jumlahItemBerTarget++;
                    
                    // RUMUS RAHASIA UNDIP: Syarat tuntas adalah 50% dari target asli (dibulatkan ke atas)
                    let syaratTuntas = Math.ceil(targetAsli / 2); 
                    
                    // Hitung persentase item ini
                    let capaianItem = (val / syaratTuntas) * 100;
                    
                    // Kalau lebih dari 100% (misal target 6 diisi 5), mentokkan di 100% (Ijo Tua)
                    if (capaianItem > 100) {
                        capaianItem = 100;
                    }
                    
                    totalBobotPersen += capaianItem;
                }
            });

            document.getElementById(`${tipe}-count`).innerText = `${totalCeklis} Terpilih`;

            // Rata-rata persentase seluruh item
            let persenTotal = 0;
            if (jumlahItemBerTarget > 0) {
                persenTotal = totalBobotPersen / jumlahItemBerTarget;
            }
            
            document.getElementById(`persen-${tipe}`).innerText = persenTotal.toFixed(1);
        }

        function filterList(tipe) {
            const input = document.getElementById(`search-${tipe}`).value.toLowerCase();
            const items = document.querySelectorAll(`.${tipe}-item`);
            items.forEach(item => {
                const label = item.querySelector('label').innerText.toLowerCase();
                item.style.display = label.includes(input) ? "flex" : "none";
            });
        }

        ffunction kirimDataKeBot() {
            const nama = document.getElementById("dpjp_nama").value.trim();
            // --- TAMBAHAN: AMBIL TANGGAL DARI FORM ---
            const tgl = document.getElementById("tgl_pengisian").value; 
            
            if (!nama) { tg.showAlert("⚠️ Mohon isi Nama DPJP!"); return; }
            // --- TAMBAHAN: PERINGATAN KALAU TANGGAL KOSONG ---
            if (!tgl) { tg.showAlert("⚠️ Mohon isi Tanggal Pengisian!"); return; }

            const p = [];
            document.querySelectorAll('.penyakit-input').forEach(inp => {
                let val = parseInt(inp.value) || 0;
                if(val > 0) p.push({ nama: inp.getAttribute('data-nama'), qty: val });
            });

            const k = [];
            document.querySelectorAll('.keterampilan-input').forEach(inp => {
                let val = parseInt(inp.value) || 0;
                if(val > 0) k.push({ nama: inp.getAttribute('data-nama'), qty: val });
            });

            if (p.length === 0 && k.length === 0) { tg.showAlert("⚠️ Isi jumlah angka minimal di 1 Penyakit / Keterampilan!"); return; }

            tg.sendData(JSON.stringify({ 
                dpjp: nama, 
                tanggal: tgl, // <--- TAMBAHAN: KIRIM DATA TANGGAL KE BOT
                penyakit: p, 
                keterampilan: k,
                est_penyakit: document.getElementById('persen-penyakit').innerText,
                est_keterampilan: document.getElementById('persen-keterampilan').innerText
            }));
        }
